{% set xorg_name = "libpthread-stubs" %}
{% set xorg_category = "xcb" %}
{% set name = "pthread-stubs" %}
{% set version = "0.4" %}
{% set sha256 = "e4d05911a3165d3b18321cc067fdd2f023f06436e391c6a28dff618a78d2e733" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  fn: {{ xorg_name }}-{{ version }}.tar.bz2
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.bz2
  sha256: {{ sha256 }}

# NOTE: this package installs no machine code on Windows. Its configure checks
# use a build-platform MinGW compiler only to determine the pkg-config flags.

build:
  number: 1003
  detect_binary_files_with_prefix: true
  ignore_run_exports_from:
    - {{ m2w64_c_compiler }}_win-64  # [target_platform == "win-arm64"]
    - {{ m2w64_c_stdlib }}_win-64    # [target_platform == "win-arm64"]

requirements:
  build:
    - m2-autoconf                   # [win]
    - m2-automake{{ am_version }}   # [win]
    - m2-libtool                    # [win]
    - pkg-config
    - gnuconfig                     # [unix]
    - m2-base                       # [win]
    - make                          # [unix]
    - m2-make                       # [win]
    - {{ compiler('c') }}           # [unix]
    - {{ stdlib("c") }}             # [unix]
    - {{ compiler('m2w64_c') }}     # [win and target_platform != "win-arm64"]
    - {{ stdlib("m2w64_c") }}       # [win and target_platform != "win-arm64"]
    # This package only uses the compiler for configure probes. Run those
    # probes with GCC from the win-64 build platform when targeting win-arm64.
    - {{ m2w64_c_compiler }}_win-64 {{ m2w64_c_compiler_version }}.*  # [target_platform == "win-arm64"]
    - {{ m2w64_c_stdlib }}_win-64 {{ m2w64_c_stdlib_version }}.*      # [target_platform == "win-arm64"]
  host:
    - xorg-util-macros

test:
  commands:
    - test -f ${PREFIX}/lib/pkgconfig/pthread-stubs.pc  # [unix]
    - 'grep -F "Version: {{ version }}" ${PREFIX}/lib/pkgconfig/pthread-stubs.pc'  # [unix]
    - 'if not exist "%LIBRARY_PREFIX%\lib\pkgconfig\pthread-stubs.pc" exit /b 1'  # [win]
    - 'findstr /C:"Version: {{ version }}" "%LIBRARY_PREFIX%\lib\pkgconfig\pthread-stubs.pc"'  # [win]
    - 'findstr /C:"Cflags: -pthread" "%LIBRARY_PREFIX%\lib\pkgconfig\pthread-stubs.pc"'  # [win]
    - 'findstr /C:"Libs: -pthread" "%LIBRARY_PREFIX%\lib\pkgconfig\pthread-stubs.pc"'  # [win]

about:
  home: https://xcb.freedesktop.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: "Stubs missing from libc for standard pthread functions"

extra:
  recipe-maintainers:
    - ccordoba12
    - mingwandroid
    - pkgw
